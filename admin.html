<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Collection Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="admin-container">
    <!-- Login Section -->
    <section id="loginSection" class="admin-section">
      <h2>Admin Login</h2>
      <form id="loginForm" class="admin-form">
        <label for="adminUser">Username</label>
        <input type="text" id="adminUser" name="username" required />
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" name="password" required />
        <button type="submit" class="btn btn-primary">Login</button>
        <p id="loginError" class="error-message" style="display:none;"></p>
      </form>
    </section>

    <!-- Main Dashboard (hidden until login) -->
    <section id="dashboardSection" class="admin-section" style="display:none;">
      <nav class="admin-nav">
        <button class="admin-tab active" data-target="productsPanel">Products</button>
        <button class="admin-tab" data-target="ordersPanel">Orders</button>
        <button class="admin-tab" data-target="homepagePanel">Homepage</button>
        <button id="logoutBtn" class="admin-logout">Logout</button>
      </nav>

      <!-- Products Management Panel -->
      <div id="productsPanel" class="admin-panel">
        <h3>Product Management</h3>
        <button id="addProductBtn" class="btn btn-secondary">Add New Product</button>
        <table class="admin-table" id="productsTable">
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Sale</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="productFormContainer" class="admin-form-container" style="display:none;"></div>
      </div>

      <!-- Orders Management Panel -->
      <div id="ordersPanel" class="admin-panel" style="display:none;">
        <h3>Order Management</h3>
        <table class="admin-table" id="ordersTable">
          <thead>
            <tr>
              <th>Order ID</th><th>Date</th><th>Status</th><th>Customer</th><th>Total</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="orderDetailContainer" class="admin-detail" style="display:none;"></div>
      </div>

      <!-- Homepage Configuration Panel -->
      <div id="homepagePanel" class="admin-panel" style="display:none;">
        <h3>Homepage Settings</h3>
        <form id="homepageForm" class="admin-form">
          <label for="announcementBar">Announcement Bar</label>
          <input type="text" id="announcementBar" name="announcementBar" />
          <label for="heroTitle">Hero Title</label>
          <textarea id="heroTitle" name="heroTitle" rows="2"></textarea>
          <label for="heroSubtitle">Hero Subtitle</label>
          <textarea id="heroSubtitle" name="heroSubtitle" rows="2"></textarea>
          <label for="showSaleSection">
            <input type="checkbox" id="showSaleSection" name="showSaleSection" /> Show Sale Section
          </label>
          <label for="saleTitle">Sale Title</label>
          <input type="text" id="saleTitle" name="saleTitle" />
          <label for="saleSubtitle">Sale Subtitle</label>
          <input type="text" id="saleSubtitle" name="saleSubtitle" />

          <!-- Image Management Section -->
          <h4 style="margin-top: 32px; border-bottom: 1px solid var(--color-grey-light); padding-bottom: 8px; font-size: 1.1rem; text-transform: uppercase;">Homepage Banners & Category Images</h4>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top: 20px;">
            <div>
              <label>Hero Section Background Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="heroImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'heroImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('heroImgUpload').click()">Upload File</button>
                <input type="text" id="heroImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/hero-bg.jpg" />
              </div>
            </div>
            <div>
              <label>Sale Section Background Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="saleImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'saleImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('saleImgUpload').click()">Upload File</button>
                <input type="text" id="saleImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/sale-bg.jpg" />
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top: 20px;">
            <div>
              <label>Shirts Category Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="shirtsImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'shirtsImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('shirtsImgUpload').click()">Upload File</button>
                <input type="text" id="shirtsImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/shirt-001.jpg" />
              </div>
            </div>
            <div>
              <label>Hoodies Category Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="hoodiesImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'hoodiesImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('hoodiesImgUpload').click()">Upload File</button>
                <input type="text" id="hoodiesImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/hoodie-001.jpg" />
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top: 20px; margin-bottom: 24px;">
            <div>
              <label>Jackets Category Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="jacketsImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'jacketsImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('jacketsImgUpload').click()">Upload File</button>
                <input type="text" id="jacketsImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/jacket-001.jpg" />
              </div>
            </div>
            <div>
              <label>T-Shirts Category Image</label>
              <div class="image-upload-wrapper">
                <input type="file" id="tshirtsImgUpload" accept="image/*" style="display:none;" onchange="handleHomepageImageUpload(event, 'tshirtsImg')" />
                <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('tshirtsImgUpload').click()">Upload File</button>
                <input type="text" id="tshirtsImgUrl" style="flex:1; padding:8px; border:1px solid var(--color-grey-light);" placeholder="images/tshirt-001.jpg" />
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Save Settings</button>
          <p id="homepageSaveMsg" class="success-message" style="display:none;"></p>
        </form>
      </div>
    </section>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
